# Uses a NEW database so it never collides with the old desktop app's `properity_mysql_database`
# (which also has tables named `properties`). See docs/import_from_desktop.sql to bring old data across.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/haven_realty?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
