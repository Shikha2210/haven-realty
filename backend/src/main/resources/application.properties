spring.datasource.url=${DB_URL:jdbc:h2:mem:properity;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate never changes it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=${PORT:${SERVER_PORT:8080}}
jwt.secret=${JWT_SECRET:local-development-only-secret-change-before-deploying-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.agent.email=${AGENT_EMAIL:}
app.agent.password=${AGENT_PASSWORD:}
app.agent.name=${AGENT_NAME:Platform Agent}
app.agent.phone=${AGENT_PHONE:9000000000}

app.storage.dir=${STORAGE_DIR:./storage}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.rate-limit.max-requests=${RATE_LIMIT_MAX:30}
# When true the one-time codes are also returned by the API (demo only; set false in production)
app.dev-expose-otp=${DEV_EXPOSE_OTP:true}
app.seed-demo=${SEED_DEMO:false}
app.mail.from=${MAIL_FROM:no-reply@haven-realty.local}
app.public-url=${PUBLIC_URL:http://localhost:5173}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

# small footprint for 512 MB hosts
spring.main.banner-mode=off
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=20
spring.servlet.multipart.max-file-size=10MB
